<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReviewRanger 🤠 - AI-Powered GitHub App</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            max-width: 600px;
            padding: 2rem;
        }
        .logo {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        .status {
            background: rgba(255, 255, 255, 0.1);
            padding: 1rem;
            border-radius: 10px;
            margin-top: 2rem;
        }
        .status h3 {
            margin: 0 0 0.5rem 0;
            color: #4ade80;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🤠</div>
        <h1>ReviewRanger</h1>
        <p>AI-powered GitHub App for intelligent pull request reviews</p>
        
        <div class="status">
            <h3>✅ Webhook Endpoint Active</h3>
            <p>This GitHub App is ready to review your pull requests!</p>
        </div>
    </div>
</body>
</html>
